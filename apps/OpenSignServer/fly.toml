app = "docsign-bettersign-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PARSE_MOUNT = "/app"
  USE_LOCAL = "TRUE"
  PORT = "8080"
  # "Sign in with BetterSign" through bs-id (cloud/parsefunction/bsidlogin.js).
  # BS_ID_USERS maps a VLAD (hex, public) to the email of an existing account.
  BS_ID_URL = "https://id.bettersign.ing"
  BS_ID_CLIENT_ID = "bs-opensign"
  BS_ID_USERS = '{"":"brendon@ixiomsoftware.com"}'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/"

[mounts]
  source = "opensign_files"
  destination = "/usr/src/app/files"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
